name: parcelis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parcelis

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9001}:9000"
      - "${MINIO_CONSOLE_PORT:-9010}:9001"
    networks:
      - parcelis

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET}
      MINIO_ASSETS_BUCKET: ${MINIO_ASSETS_BUCKET}
    volumes:
      - ./infra/minio/assets:/assets:ro
      - ./infra/minio/property-images:/property-images:ro
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set parcelis http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing parcelis/$$MINIO_BUCKET;
      /usr/bin/mc anonymous set none parcelis/$$MINIO_BUCKET;
      /usr/bin/mc cors set parcelis/$$MINIO_BUCKET /property-images;
      /usr/bin/mc mb --ignore-existing parcelis/$$MINIO_ASSETS_BUCKET;
      /usr/bin/mc cp --recursive /assets/ parcelis/$$MINIO_ASSETS_BUCKET/;
      /usr/bin/mc anonymous set download parcelis/$$MINIO_ASSETS_BUCKET;
      "
    networks:
      - parcelis

  migrate:
    image: parcelis/app:v0.3.0
    command: pnpm --filter @parcelis/db exec prisma migrate deploy --schema prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parcelis

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ./infra/docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - docs
    networks:
      - parcelis

  app:
    image: parcelis/app:v0.3.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - parcelis

  docs:
    image: parcelis/docs:v0.3.0
    networks:
      - parcelis

volumes:
  postgres-data:
  minio-data:

networks:
  parcelis:
    name: parcelis
    ipam:
      config:
        - subnet: 10.89.0.0/24
