name: parcelis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parcelis

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - parcelis

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET}
      MINIO_ASSETS_BUCKET: ${MINIO_ASSETS_BUCKET}
    volumes:
      - ./infra/minio/assets:/assets:ro
      - ./infra/minio/property-images:/property-images:ro
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set parcelis http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing parcelis/$$MINIO_BUCKET;
      /usr/bin/mc anonymous set none parcelis/$$MINIO_BUCKET;
      /usr/bin/mc cors set parcelis/$$MINIO_BUCKET /property-images;
      /usr/bin/mc mb --ignore-existing parcelis/$$MINIO_ASSETS_BUCKET;
      /usr/bin/mc cp --recursive /assets/ parcelis/$$MINIO_ASSETS_BUCKET/;
      /usr/bin/mc anonymous set download parcelis/$$MINIO_ASSETS_BUCKET;
      "
    networks:
      - parcelis

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: pnpm --filter @parcelis/db exec prisma migrate deploy --schema prisma/schema.prisma
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parcelis

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - parcelis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_S3_URL: ${NEXT_PUBLIC_S3_URL}
        NEXT_PUBLIC_BRAND_LOGO_URL: ${NEXT_PUBLIC_BRAND_LOGO_URL}
        NEXT_PUBLIC_DARK_BRAND_LOGO_URL: ${NEXT_PUBLIC_DARK_BRAND_LOGO_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - parcelis

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      target: caddy
    ports:
      - "${DOCS_PORT:-8080}:80"
    networks:
      - parcelis

volumes:
  postgres-data:
  minio-data:

networks:
  parcelis:
