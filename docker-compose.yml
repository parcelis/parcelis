name: parcelis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the production environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the production environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parcelis

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the production environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the production environment}
    volumes:
      - minio-data:/data
    networks:
      - parcelis

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the production environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the production environment}
      MINIO_BUCKET: ${OBJECT_STORAGE_BUCKET:?Set OBJECT_STORAGE_BUCKET}
      MINIO_ASSETS_BUCKET: ${MINIO_ASSETS_BUCKET:?Set MINIO_ASSETS_BUCKET}
    volumes:
      - ./infra/minio/assets:/assets:ro
      - ./infra/minio/property-images:/property-images:ro
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set parcelis http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing parcelis/$$MINIO_BUCKET;
      /usr/bin/mc anonymous set none parcelis/$$MINIO_BUCKET;
      /usr/bin/mc cors set parcelis/$$MINIO_BUCKET /property-images;
      /usr/bin/mc mb --ignore-existing parcelis/$$MINIO_ASSETS_BUCKET;
      /usr/bin/mc cp --recursive /assets/ parcelis/$$MINIO_ASSETS_BUCKET/;
      /usr/bin/mc anonymous set download parcelis/$$MINIO_ASSETS_BUCKET;
      "
    networks:
      - parcelis

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: pnpm --filter @parcelis/db exec prisma migrate deploy --schema prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parcelis

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the public web URL}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?Set OBJECT_STORAGE_PUBLIC_ENDPOINT}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?Set OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - parcelis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the public API URL}
        NEXT_PUBLIC_OBJECT_STORAGE_URL: ${NEXT_PUBLIC_OBJECT_STORAGE_URL:?Set NEXT_PUBLIC_OBJECT_STORAGE_URL}
        NEXT_PUBLIC_BRAND_LOGO_URL: ${NEXT_PUBLIC_BRAND_LOGO_URL:?Set NEXT_PUBLIC_BRAND_LOGO_URL}
        NEXT_PUBLIC_DARK_BRAND_LOGO_URL: ${NEXT_PUBLIC_DARK_BRAND_LOGO_URL:?Set NEXT_PUBLIC_DARK_BRAND_LOGO_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - parcelis

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      target: caddy
    ports:
      - "${DOCS_PORT:-8080}:80"
    networks:
      - parcelis

volumes:
  postgres-data:
  minio-data:

networks:
  parcelis:
