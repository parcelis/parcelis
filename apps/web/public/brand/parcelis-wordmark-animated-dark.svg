<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title">
  <title id="title">Parcelis dark wordmark reveal</title>
  <style>
    .mark { transform-box: fill-box; transform-origin: center; animation: mark-shift 9s cubic-bezier(.22,1,.36,1) 1 forwards; }
    .word { opacity: 0; transform: translateX(-30px); animation: word-in .68s cubic-bezier(.22,1,.36,1) 5.72s 1 forwards; }
    @keyframes mark-shift { 0%,60% { transform: translateX(0) scale(1); } 75%,100% { transform: translateX(-350px) scale(.68); } }
    @keyframes word-in { from { opacity:0; transform:translateX(-30px); } to { opacity:1; transform:translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .mark { animation:none; transform:translateX(-350px) scale(.68); } .word { animation:none; opacity:1; transform:none; } }
  </style>
  <defs>
    <clipPath id="word-reveal">
      <rect x="308" y="92" width="0" height="244">
        <animate attributeName="width" from="0" to="850" begin="5.68s" dur=".82s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <image class="mark" x="470" y="26" width="260" height="368" href="data:image/svg+xml;base64,"/>
  <g clip-path="url(#word-reveal)">
    <text class="word" x="318" y="260" fill="#ffffff" font-family="Avenir Next, Avenir, Inter, Helvetica Neue, Arial, sans-serif" font-size="132" font-weight="600" letter-spacing="-6">arcelis</text>
  </g>
</svg>
