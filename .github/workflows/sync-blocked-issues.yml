name: Sync blocked issue labels

on:
  issues:
    types: [closed, reopened]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    concurrency:
      group: sync-blocked-issues-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const blockedLabel = "blocked";

            async function labelsFor(issueNumber) {
              return github.paginate(
                github.rest.issues.listLabelsOnIssue,
                { owner, repo, issue_number: issueNumber }
              );
            }

            async function dependencyState(issueNumber) {
              let state = null;
              let blocked = false;
              let cursor = null;

              do {
                const page = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        state
                        blockedBy(first: 100, after: $cursor) {
                          nodes { state }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number: issueNumber, cursor }
                );

                const issue = page.repository.issue;
                if (!issue) return null;
                state = issue.state;
                blocked ||= issue.blockedBy.nodes.some(
                  (blocker) => blocker.state !== "CLOSED"
                );
                cursor = issue.blockedBy.pageInfo.hasNextPage
                  ? issue.blockedBy.pageInfo.endCursor
                  : null;
              } while (cursor);

              return { state, blocked };
            }

            async function syncIssue(issueNumber) {
              core.info(`Syncing blocked label for issue #${issueNumber}`);
              const current = await dependencyState(issueNumber);
              if (!current) {
                core.info(`Issue #${issueNumber} no longer exists; skipped`);
                return;
              }

              const labels = await labelsFor(issueNumber);
              const hasBlockedLabel = labels.some(
                label => label.name === blockedLabel
              );

              if (current.state !== "OPEN") {
                if (hasBlockedLabel) {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: blockedLabel,
                  });
                  core.info(`Removed "${blockedLabel}" from issue #${issueNumber} because it is closed`);
                } else {
                  core.info(`Issue #${issueNumber} is closed; no label update needed`);
                }
                return;
              }

              const latest = await dependencyState(issueNumber);
              if (!latest) return;

              if (latest.state !== "OPEN") {
                if (hasBlockedLabel) {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: blockedLabel,
                  });
                  core.info(`Removed "${blockedLabel}" from issue #${issueNumber} because it is closed`);
                } else {
                  core.info(`Issue #${issueNumber} is closed; no label update needed`);
                }
                return;
              }

              if (latest.blocked && !hasBlockedLabel) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: [blockedLabel],
                });
                core.info(`Added "${blockedLabel}" to issue #${issueNumber}`);
              }

              if (!latest.blocked && hasBlockedLabel) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: blockedLabel,
                });
                core.info(`Removed "${blockedLabel}" from issue #${issueNumber} because it is no longer blocked`);
              }

              if (latest.blocked === hasBlockedLabel) {
                core.info(`Issue #${issueNumber} is in sync; no label update needed`);
              }
            }

            async function allOpenIssues() {
              const numbers = [];
              let cursor = null;

              do {
                const result = await github.graphql(
                  `query($owner: String!, $repo: String!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      issues(
                        first: 100,
                        after: $cursor,
                        states: OPEN,
                        orderBy: { field: CREATED_AT, direction: ASC }
                      ) {
                        nodes { number }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }`,
                  { owner, repo, cursor }
                );

                const issues = result.repository.issues;
                numbers.push(...issues.nodes.map(issue => issue.number));
                cursor = issues.pageInfo.hasNextPage
                  ? issues.pageInfo.endCursor
                  : null;
              } while (cursor);

              return numbers;
            }

            async function closedIssuesWithBlockedLabel() {
              return github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "closed",
                labels: blockedLabel,
                per_page: 100,
              }).then(issues => issues.map(issue => issue.number));
            }

            async function syncSafely(issueNumber) {
              try {
                await syncIssue(issueNumber);
              } catch (error) {
                core.warning(`Failed to sync issue #${issueNumber}: ${error.message}`);
                core.setFailed(`Failed to sync issue #${issueNumber}`);
              }
            }

            if (context.eventName === "issues") {
              const sourceIssue = context.payload.issue.number;

              const affected = new Set([sourceIssue]);
              let cursor = null;

              do {
                const result = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        blocking(first: 100, after: $cursor) {
                          nodes { number }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number: sourceIssue, cursor }
                );

                const blocking = result.repository.issue.blocking;
                blocking.nodes.forEach((issue) => affected.add(issue.number));
                cursor = blocking.pageInfo.hasNextPage
                  ? blocking.pageInfo.endCursor
                  : null;
              } while (cursor);

              for (const issueNumber of affected) {
                await syncSafely(issueNumber);
              }
            } else {
              const issueNumbers = new Set([
                ...(await allOpenIssues()),
                ...(await closedIssuesWithBlockedLabel()),
              ]);
              for (const issueNumber of issueNumbers) {
                await syncSafely(issueNumber);
              }
            }
