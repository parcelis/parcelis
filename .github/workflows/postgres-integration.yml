name: PostgreSQL Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select integration suites
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.select.outputs.run-tests }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - name: Select suites from changed files
        id: select
        run: node scripts/postgres-integration-changes.mjs

  integration:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: parcelis
          POSTGRES_PASSWORD: parcelis
          POSTGRES_DB: parcelis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcelis -d parcelis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://parcelis:parcelis@localhost:5432/parcelis_test?schema=public
      OUTBOX_TEST_DATABASE_URL: postgresql://parcelis:parcelis@localhost:5432/parcelis_integration_test?schema=public
      API_TOKEN_TEST_DATABASE_URL: postgresql://parcelis:parcelis@localhost:5432/parcelis_integration_test?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: docker exec ${{ job.services.postgres.id }} createdb -U parcelis parcelis_integration_test
      - if: matrix.suite != 'database'
        run: pnpm --filter @parcelis/email --filter @parcelis/jobs build
      - if: matrix.suite == 'database'
        run: pnpm --filter @parcelis/db test:integration
      - if: matrix.suite == 'worker'
        run: pnpm --filter @parcelis/worker test:integration
      - if: matrix.suite == 'api-tokens'
        run: pnpm --filter @parcelis/api exec tsx --test 'src/tests/api-tokens/*.integration.ts'
