name: Create Kanban card on issue approval
run-name: "Create Kanban card for issue #${{ github.event.issue.number }} : ${{ github.event.issue.title }}"

on:
  issues:
    types: [labeled]

jobs:
  create-kanban-card:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'ready for development'

    steps:
      - name: Create Kanban card
        env:
          KAN_API_KEY: ${{ secrets.KANBAN_API_KEY }}
          KAN_LIST_PUBLIC_ID: ${{ secrets.KAN_LIST_PUBLIC_ID }}
          KAN_BOARD_PUBLIC_ID: ${{ secrets.KAN_BOARD_PUBLIC_ID }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$KAN_API_KEY" ]; then
            echo "KANBAN_API_KEY is not configured."
            exit 1
          fi

          description=$(jq -n -r \
            --arg repo "$REPOSITORY" \
            --arg number "$ISSUE_NUMBER" \
            --arg url "$ISSUE_URL" \
            --arg body "$ISSUE_BODY" \
            --arg title "$ISSUE_TITLE" \
            '"[\($repo)#\($number)](\($url))\n\n\($body)\n\n**\($title)**"')

          existing_card=$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $KAN_API_KEY" \
              "https://kan.bn/api/v1/boards/$KAN_BOARD_PUBLIC_ID" |
              jq -r --arg issueTitle "$ISSUE_TITLE" --arg issueUrl "$ISSUE_URL" '
                [
                  .lists[]?.cards[]?
                  | select(.title == $issueTitle or ((.description // "") | contains($issueUrl)))
                  | .publicId
                ]
                | first // empty
              '
          )

          if [ -n "$existing_card" ]; then
            card=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $KAN_API_KEY" \
              "https://kan.bn/api/v1/cards/$existing_card")

            has_issue_link=$(jq -r --arg issueUrl "$ISSUE_URL" '
              [
                (.description // ""),
                (.activities[]?.comment?.comment // "")
              ]
              | any(.[]; contains($issueUrl))
            ' <<< "$card")

            if [ "$has_issue_link" != "true" ]; then
              curl --fail-with-body --silent --show-error \
                --request POST \
                --url "https://kan.bn/api/v1/cards/$existing_card/comments" \
                --header "Authorization: Bearer $KAN_API_KEY" \
                --header "Content-Type: application/json" \
                --data "$(jq -n --arg comment "$description" '{comment: $comment}')"

              echo "Added the GitHub issue link to the existing Kan card."
            else
              echo "Kan card already contains the GitHub issue link."
            fi

            exit 0
          fi
          
          payload=$(jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg description "$description" \
            --arg listPublicId "$KAN_LIST_PUBLIC_ID" \
            '{
              title: $title,
              description: $description,
              listPublicId: $listPublicId,
              labelPublicIds: [],
              memberPublicIds: [],
              position: "end",
              dueDate: null
            }')

          curl --fail-with-body \
            --request POST \
            --url "https://kan.bn/api/v1/cards" \
            --header "Authorization: Bearer $KAN_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$payload"
