name: Publish Docker Container Images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: apps
            file: Dockerfile.app
            title: Parcelis Apps
            description: Parcelis application and API service for the Parcelis Docker Compose stack.
          - image: docs
            file: apps/docs/Dockerfile
            target: nginx
            title: Parcelis Docs
            description: Parcelis documentation site for the Parcelis Docker Compose stack.
          - image: proxy
            file: infra/docker/proxy/Dockerfile
            target: proxy
            title: Parcelis Proxy
            description: Nginx reverse proxy for the Parcelis Docker Compose stack.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: parcelis/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=ref,event=tag,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
