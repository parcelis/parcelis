name: Publish Docker Container Images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apps
            file: Dockerfile.app
            target: app
            title: Parcelis Apps
            description: Parcelis application and API service for the Parcelis Docker Compose stack.
          - image: docs
            file: apps/docs/Dockerfile
            target: nginx
            title: Parcelis Docs
            description: Parcelis documentation site for the Parcelis Docker Compose stack.
          - image: parcelis
            file: Dockerfile.app
            target: single-image
            title: Parcelis Single Image
            description: Parcelis web app, API, documentation site, and nginx edge routing in a single image.
          - image: proxy
            file: infra/docker/proxy/Dockerfile
            target: proxy
            title: Parcelis Proxy
            description: Nginx reverse proxy for the Parcelis Docker Compose stack.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: parcelis/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=ref,event=tag,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub description
        if: matrix.image != 'parcelis'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # The legacy description API requires a user PAT; organization tokens are unsupported.
          DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          IMAGE: ${{ matrix.image }}
          DESCRIPTION: ${{ matrix.description }}
        run: |
          token=$(jq -n '{identifier: env.DOCKERHUB_USERNAME, secret: env.DOCKERHUB_DESCRIPTION_TOKEN}' |
            curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- https://hub.docker.com/v2/auth/token |
            jq -er '.access_token | select(type == "string" and length > 0)')
          echo "::add-mask::$token"
          jq -n '{description: env.DESCRIPTION}' |
            curl --fail --silent --show-error --output /dev/null \
              --request PATCH \
              --header "Authorization: Bearer $token" \
              --header 'Content-Type: application/json' \
              --data-binary @- "https://hub.docker.com/v2/repositories/parcelis/$IMAGE/"
