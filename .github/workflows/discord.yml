name: Post GitHub notifications to Discord

on:
  pull_request:
    types: [opened, reopened]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send new PR notification
        if: github.event_name == 'pull_request'
        uses: stegzilla/discord-notify@v2
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: New PR opened — ${{ github.event.pull_request.title }}
          message: |
            Creator: ${{ github.event.pull_request.user.login }}
            ${{ github.event.pull_request.html_url }}

      - name: Send new issue notification
        if: github.event_name == 'issues'
        uses: stegzilla/discord-notify@v2
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: New issue opened — ${{ github.event.issue.title }}
          message: |
            Creator: ${{ github.event.issue.user.login }}
            ${{ github.event.issue.html_url }}
