name: Documentation Update

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: documentation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation requirement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check documentation requirement
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { evaluateDocumentation } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/check-pr-documentation.mjs`).href
            );
            const result = await evaluateDocumentation(github, context);
            core.setOutput('passed', String(result.passed));
            core.setOutput('message', result.message);
            await core.summary
              .addHeading(`Documentation check: ${result.passed ? 'Passed' : 'Failed'}`)
              .addCodeBlock(result.message)
              .write();
            if (result.passed) core.info(result.message);
            else core.setFailed(result.message);

      - name: Create bot token
        if: ${{ !cancelled() && steps.check.outputs.passed != '' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ASSIGNMENT_APP_ID }}
          private-key: ${{ secrets.ASSIGNMENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Update documentation comment
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          DOCUMENTATION_PASSED: ${{ steps.check.outputs.passed }}
          DOCUMENTATION_MESSAGE: ${{ steps.check.outputs.message }}
          DOCUMENTATION_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const { updateDocumentationComment } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/check-pr-documentation.mjs`).href
            );
            await updateDocumentationComment(github, context, process.env.DOCUMENTATION_BOT_LOGIN, {
              passed: process.env.DOCUMENTATION_PASSED === 'true',
              message: process.env.DOCUMENTATION_MESSAGE,
            });
