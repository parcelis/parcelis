[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:api]
directory=/repo/apps/api
command=node scripts/start.mjs
environment=API_PORT="__API_INTERNAL_PORT__",API_HOSTNAME="0.0.0.0"
stopwaitsecs=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=pnpm --filter @parcelis/web exec next start --hostname 0.0.0.0 --port 3001
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
