server {
  listen 3000;
  listen [::]:3000;
  server_name _;

  # Emit relative redirects so port-mapped deployments (APP_PORT != 3000)
  # keep the external host and port when nginx appends trailing slashes.
  absolute_redirect off;

  # Documentation site is bundled with the image and served as static files
  # from /usr/share/parcelis-docs. The trailing-slash rewrite mirrors the
  # behavior of the modular proxy image so that /docs and /docs/ both work.
  location = /docs {
    return 308 /docs/;
  }

  location ^~ /docs/ {
    alias /usr/share/parcelis-docs/;
    index index.html;
    try_files $uri $uri/ $uri/index.html /docs/index.html =404;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /trpc/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public liveness endpoint for the API, served through nginx so container
  # and Compose health checks observe the same path as external traffic. The
  # container health check additionally requests `/` to cover the web app,
  # since Supervisor keeps the container running while a child process fails.
  location = /healthz {
    proxy_pass http://127.0.0.1:4000/api/v1/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 1s;
    proxy_send_timeout 1s;
    proxy_read_timeout 1s;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}