server {
  listen 3000;
  server_name _;

  # Documentation site is bundled with the image and served as static files
  # from /usr/share/parcelis-docs. The trailing-slash rewrite mirrors the
  # behavior of the modular proxy image so that /docs and /docs/ both work.
  location = /docs {
    return 308 /docs/;
  }

  location ^~ /docs/ {
    alias /usr/share/parcelis-docs/;
    index index.html;
    try_files $uri $uri/ $uri/index.html /index.html =404;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /trpc/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}