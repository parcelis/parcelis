name: parcelis-dev

services:
  proxy-service:
    image: nginx:1.31.3-alpine
    container_name: parcelis-dev-proxy
    environment:
      API_UPSTREAM_PORT: ${API_PORT:-40010}
      DOCS_UPSTREAM_PORT: ${DOCS_PORT:-40000}
      APP_UPSTREAM_PORT: ${APP_PORT:-30000}
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./infra/nginx/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-service:
    image: postgres:16-alpine
    container_name: parcelis-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parcelis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcelis}
      POSTGRES_DB: ${POSTGRES_DB:-parcelis}
    ports:
      - "${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin-service:
    image: dpage/pgadmin4:latest
    container_name: parcelis-dev-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@parcelis.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-parcelis}
    ports:
      - "${PGADMIN_PORT:-8000}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres-service:
        condition: service_healthy

  minio-service:
    image: minio/minio:latest
    container_name: parcelis-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parcelis-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parcelis-minio-secret}
    ports:
      - "${MINIO_API_PORT:-9001}:9000"
      - "${MINIO_CONSOLE_PORT:-9010}:9001"
    volumes:
      - minio-data:/data

  minio-init-service:
    image: minio/mc:latest
    container_name: parcelis-dev-minio-init
    depends_on:
      - minio-service
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parcelis-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parcelis-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-parcelis-images}
      MINIO_ASSETS_BUCKET: ${MINIO_ASSETS_BUCKET:-parcelis-assets}
    volumes:
      - ./infra/minio/assets:/assets:ro
      - ./infra/minio/property-images:/property-images:ro
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set parcelis http://minio-service:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing parcelis/$$MINIO_BUCKET;
      /usr/bin/mc anonymous set none parcelis/$$MINIO_BUCKET;
      /usr/bin/mc cors set parcelis/$$MINIO_BUCKET /property-images;
      /usr/bin/mc mb --ignore-existing parcelis/$$MINIO_ASSETS_BUCKET;
      /usr/bin/mc cp --recursive /assets/ parcelis/$$MINIO_ASSETS_BUCKET/;
      /usr/bin/mc anonymous set download parcelis/$$MINIO_ASSETS_BUCKET;
      "

volumes:
  postgres-data:
  pgadmin-data:
  minio-data:

networks:
  default:
    name: parcelis-dev-local
    ipam:
      config:
        - subnet: 10.88.1.0/24
